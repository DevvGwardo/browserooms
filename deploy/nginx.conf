server {
    listen 8000;
    server_name backrooms.exe.xyz;
    root /srv/browserooms/current;
    index index.html;

    access_log /var/log/nginx/browserooms.access.log;
    error_log /var/log/nginx/browserooms.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream model/gltf-binary;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(glb|hdr|bin|png|jpg|jpeg|wav|mp3)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
