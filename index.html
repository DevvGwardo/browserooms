<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181914" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b3a05f'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%233a3220' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Backrooms</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interactive Backrooms environment"></canvas>
      <canvas id="vhs-view" aria-hidden="true" hidden></canvas>
      <canvas id="exploration-map" role="img" aria-label="Explored floor plan and camera heading" hidden></canvas>
      <header id="title">
        <h1>Backrooms</h1>
        <button id="enter" disabled>enter the back rooms.</button>
      </header>
      <div id="loading" role="status" aria-live="polite">
        <span id="load-label">Loading the environment</span>
        <progress id="load-progress" aria-label="Loading scene"></progress>
      </div>
      <div id="toolbar" hidden>
        <div class="navigation-actions">
          <button id="explore" class="primary">Resume</button>
          <span id="help">WASD move · Mouse look · Q/E zoom · V view · M sound · Esc menu</span>
        </div>
        <button id="settings-button" aria-controls="settings" aria-expanded="false">Image settings</button>
      </div>
      <div id="walk-actions" hidden>
        <button id="audio-toggle" aria-pressed="false">Enable sound</button>
        <button id="view-toggle">Third person</button>
        <button id="leave" aria-label="Open menu" hidden>Menu</button>
      </div>
      <section id="settings" aria-label="Image settings" hidden>
        <div class="settings-heading"><h2>Image settings</h2><button id="close-settings" aria-label="Close image settings">Close</button></div>
        <div id="vhs-controls" hidden>
          <label for="vhs-preset">VHS preset</label>
          <select id="vhs-preset"></select>
          <p id="vhs-status" role="status" hidden></p>
        </div>
        <label for="walking-motion">Walking motion</label>
        <select id="walking-motion"></select>
        <label for="standing-motion">Standing motion</label>
        <select id="standing-motion"></select>
        <label for="exposure">Exposure <output id="exposure-output">0.0 EV</output></label>
        <input id="exposure" type="range" min="-2" max="2" step="0.05" value="0" />
        <label class="check"><span>Soft light bloom</span><input id="bloom" type="checkbox" checked /></label>
        <div id="clean-options">
          <label for="resolution">Resolution</label>
          <select id="resolution"><option value="1">Native</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
          <label class="check"><span>Film grain</span><input id="grain" type="checkbox" /></label>
          <label class="check"><span>Auto quality</span><input id="auto-quality" type="checkbox" checked /></label>
        </div>
        <label for="viewpoint">Viewpoint</label>
        <select id="viewpoint"></select>
        <button id="reset-view">Reset view</button>
        <output id="performance" aria-label="Rendering performance" aria-live="off" hidden></output>
      </section>
      <span id="alarm-hint" hidden></span>
      <div id="level-banner" role="status"></div>
      <div id="entity-hint" hidden>IT SEES YOU — RUN</div>
      <div id="taken" hidden><div class="taken-eyes"><span>◉</span><span>◉</span></div><p id="taken-sub"></p></div>
      <div id="escaped" hidden><h2>YOU ESCAPED</h2><p id="escape-time"></p><button id="escape-again">noclip again</button></div>
      <div id="touch-controls" hidden>
        <div id="stick" aria-label="Drag to walk"><span></span></div>
        <span id="touch-hint">Drag the scene to look</span>
      </div>
      <div id="error" role="alert" hidden><p id="error-message"></p><button id="reload">Try again</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
